  // ---------------------------------------------------------------- KIOSK
  const KSVC = [
    { id: "CASH", en: "Cash", kn: "ನಗದು", hi: "नकद", icon: '<rect x="3" y="7" width="18" height="11" rx="2"/><circle cx="12" cy="12.5" r="2.5"/>' },
    { id: "PASSBOOK", en: "Passbook", kn: "ಪಾಸ್‌ಬುಕ್", hi: "पासबुक", icon: '<path d="M6 3h11a1 1 0 0 1 1 1v16H7a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1Z"/><path d="M9 7h6M9 11h6"/>' },
    { id: "ACCOUNT", en: "Account / KYC", kn: "ಖಾತೆ / ಕೆವೈಸಿ", hi: "खाता / केवाईसी", icon: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>' },
    { id: "REMIT", en: "DD / transfer", kn: "ಡಿಡಿ / ವರ್ಗಾವಣೆ", hi: "डीडी / ट्रांसफर", icon: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>' },
    { id: "PENSION", en: "Pension", kn: "ಪಿಂಚಣಿ", hi: "पेंशन", icon: '<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10Z"/>' },
    { id: "LOAN", en: "Loan / FD", kn: "ಸಾಲ / ಎಫ್‌ಡಿ", hi: "ऋण / एफडी", icon: '<path d="M3 10 12 4l9 6"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/>' },
  ];
  const CNT = { CASH: { en: "cash counter", kn: "ನಗದು ಕೌಂಟರ್", hi: "नकद काउंटर" }, GENERAL: { en: "general counter", kn: "ಸಾಮಾನ್ಯ ಕೌಂಟರ್", hi: "सामान्य काउंटर" }, EXPERT: { en: "loans & advisory desk", kn: "ಸಾಲ ವಿಭಾಗ", hi: "ऋण डेस्क" } };
  function renderKiosk(v) {
    const day = S.day, b = S.branch, Q = S.kiosk, st = stateFor(day, b);
    const L = Q.lang;
    const pick = (o) => o[L] || o.en;
    let out = `<div class="empty">Choose a service to see what the kiosk says.</div>`;
    if (Q.svc) {
      const pool = D.meta.services[Q.svc].pool, red = D.meta.redirect[Q.svc];
      const w = st.ev[pool].wait_bins[Q.bin];
      const canSelf = red.share > 0 && (!red.needs_digital || Q.digital);
      const prio = Q.senior || Q.help;
      const tok = `${"CGL"[POOLS.indexOf(pool)]}-${String(20 + Q.bin * 3 + (Q.svc.length % 5)).padStart(3, "0")}`;
      const wait = Math.max(1, Math.round(prio ? w * 0.35 : w));
      const say = { en: `Please go to the ${CNT[pool].en}. Your token is ${tok}. Expected wait about ${wait} minutes.`,
        kn: `ದಯವಿಟ್ಟು ${CNT[pool].kn}ಗೆ ಹೋಗಿ. ನಿಮ್ಮ ಟೋಕನ್ ${tok}. ಸುಮಾರು ${wait} ನಿಮಿಷ ಕಾಯಬೇಕಾಗಬಹುದು.`,
        hi: `कृपया ${CNT[pool].hi} पर जाएँ। आपका टोकन ${tok} है। लगभग ${wait} मिनट प्रतीक्षा।` };
      const docs = { ACCOUNT: "Aadhaar, PAN card and one photo", LOAN: "Aadhaar, PAN, income proof or land records, 6 months' statement", PENSION: "PPO number, Aadhaar and passbook" }[Q.svc];
      out = `<div class="tokenout">
        ${canSelf && w > 5 ? `<div class="msg" style="background:var(--accent-soft);border-color:var(--accent-line)"><b>Skip the queue:</b> ${esc(red.channel)}. ${Q.digital ? "It takes about 2 minutes." : "A colleague or the voice kiosk will help you."}</div>` : ""}
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="tokenno" style="color:${COLOR[pool]}">${tok}</div>
          <div><div><span class="cell-pool"><i style="background:${COLOR[pool]}"></i>${PL[pool]}</span> ${prio ? '<span class="chip acc">Priority lane</span>' : ""}</div>
          <div class="muted" style="margin-top:4px">Predicted wait at ${binLab(Q.bin)}: <b style="color:var(--ink)">${wait} min</b>${prio ? " (priority)" : ""}</div></div></div>
        <div class="msg"><div class="to">Kiosk speaks (${L === "kn" ? "ಕನ್ನಡ" : L === "hi" ? "हिंदी" : "English"})</div><span class="${L === "kn" ? "kn" : ""}" style="font-size:14px">${esc(say[L])}</span></div>
        ${docs ? `<div class="msg"><div class="to">Document check before you queue</div>Please have: ${esc(docs)}. Missing something? The kiosk books a slot instead of a wasted wait.</div>` : ""}
        ${!Q.digital ? `<div class="muted" style="font-size:12.5px">No smartphone? The kiosk calls the customer's basic phone when their turn is 10 minutes away, so they can sit or step out.</div>` : ""}
        ${Q.help ? `<div class="muted" style="font-size:12.5px">The kiosk has alerted the nearest free staff member to assist.</div>` : ""}
      </div>`;
    }
    v.innerHTML = `
    <section class="section">
      <div class="sechead"><span class="layer">Customer redirection</span><h2>Token kiosk at ${esc(BR[b].name)}</h2>
        <p>Pictures and voice instead of reading. The kiosk uses the same forecast and plan: it offers self-service only to customers who can use it, sends priority customers to a faster lane and quotes a realistic wait.</p></div>
      <div class="grid g-2">
        <div class="card" style="display:grid;gap:14px">
          <div class="seg" role="group" aria-label="Language">${[["en", "English"], ["kn", "ಕನ್ನಡ"], ["hi", "हिंदी"]].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${L === k}" class="${k === "kn" ? "kn" : ""}">${l}</button>`).join("")}</div>
          <div class="kiosk">${KSVC.map((s) => `<button type="button" data-svc="${s.id}" aria-pressed="${Q.svc === s.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${s.icon}</svg><span class="${L === "kn" ? "kn" : ""}">${esc(pick(s))}</span>${L !== "en" ? `<span class="kn">${esc(s.en)}</span>` : ""}</button>`).join("")}</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap">
            <label class="switch"><input type="checkbox" data-q="senior" ${Q.senior ? "checked" : ""}> Aged 75+</label>
            <label class="switch"><input type="checkbox" data-q="help" ${Q.help ? "checked" : ""}> Needs assistance</label>
            <label class="switch"><input type="checkbox" data-q="digital" ${Q.digital ? "checked" : ""}> Uses mobile banking</label></div>
          <label class="f" style="display:grid;gap:6px;font-size:13px"><span style="display:flex;justify-content:space-between"><span>Arrival time (${esc(D.meta.day_labels[day])})</span><b class="num">${binLab(Q.bin)}</b></span>
            <input type="range" id="k-bin" min="0" max="23" value="${Q.bin}"></label>
        </div>
        <div>${out}</div>
      </div>
    </section>`;
    v.querySelectorAll("[data-lang]").forEach((btn) => { btn.onclick = () => { Q.lang = btn.dataset.lang; render(); }; });
    v.querySelectorAll("[data-svc]").forEach((btn) => { btn.onclick = () => { Q.svc = btn.dataset.svc; render(); }; });
    v.querySelectorAll("[data-q]").forEach((c) => { c.onchange = () => { Q[c.dataset.q] = c.checked; render(); }; });
    v.querySelector("#k-bin").oninput = (e) => { Q.bin = +e.target.value; clearTimeout(renderKiosk._t); renderKiosk._t = setTimeout(render, 80); };
  }

    }

          <div class="log" style="max-height:560px;margin-top:8px">${S.log.length ? S.log.map((l) => `<div class="e"><div class="t">${l.t}</div><div>${esc(l.text)} <span class="muted">· ${esc(BR[l.branch].name)} · ${esc(l.who)}</span></div></div>`).join("") : `<div class="empty">No activity yet.</div>`}</div></div>
      </div>
    </section>`;
    v.querySelector("#copy-log").onclick = () => copyText(S.log.map((l) => `${l.t} ${BR[l.branch].name}: ${l.text} (${l.who})`).join("\n") || "No activity", "Log copied");
    v.querySelector("#reset").onclick = () => { S.approved = {}; S.dismissed = {}; S.done = {}; S.sent = {}; S.log = []; S.callbacks = {}; S.liveAck = {}; S.autopilot = false; S.clock = 17 * 60 + 35; ver++; render(); toast("Demo reset"); };
  }

  // ---------------------------------------------------------------- MODEL & DATA
  function renderModel(v) {
    const M = D.model.metrics, BT = D.backtest.summary, C = D.model.calibration, Q = D.data_quality;
    const pctChg = (a, b) => Math.round((b / a - 1) * 100);
    const row = (label, o) => {
      const vals = [o.model, o.seasonal_naive, o.avg_last_4_weeks].filter((x) => x != null);
      const mx = Math.max(...vals);
      const cell = (x, col) => x == null ? "<td></td>" : `<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:9px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:50px"><i style="display:block;height:100%;width:${(x / mx) * 100}%;background:${col}"></i></div><span class="num" style="width:44px;text-align:right">${fmt(x * 100, 1)}%</span></div></td>`;
      return `<tr><td>${label}</td>${cell(o.model, "var(--s-cash)")}${cell(o.seasonal_naive, "var(--s-before)")}${cell(o.avg_last_4_weeks, "var(--s-before)")}</tr>`;
    };
    const imp = Object.entries(M.driver_importance || {});
    const impLab = { base: "Branch, service, hour, weekday", recent: "Recent demand (lags)", month_start: "Month-start", holiday: "Holidays and closures", life_cert: "Life-certificate season", year_end: "Year-end", festival: "Festivals", crop: "Crop season", fee: "Fee season", appointments: "Appointments booked" };
    const imx = Math.max(...imp.map((x) => x[1]));
    v.innerHTML = `
    <section class="section">
      <div class="sechead"><span class="layer">Evidence</span><h2>Does it work? Tested on a month the model never saw</h2>
        <p>September 2026 was held out. For each branch-day we planned from the forecast alone, then replayed the same ${fmt(BT.customers)} customers (arrival times, service times, patience) through a minute-by-minute simulation, with and without the plan. Staff lending is left out, so this is conservative.</p></div>
      <div class="tiles" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div class="tile"><div class="k">Walkouts</div><div class="v num">${fmt(BT.walkouts.full_plan)}<small>was ${fmt(BT.walkouts.before)}</small></div><div class="was"><span class="chg good">${pctChg(BT.walkouts.before, BT.walkouts.full_plan)}%</span> · staffing alone ${pctChg(BT.walkouts.before, BT.walkouts.staffing_only)}%</div></div>
        <div class="tile"><div class="k">Average wait (served)</div><div class="v num">${fmt(BT.avg_wait.full_plan, 1)}<small>was ${fmt(BT.avg_wait.before, 1)} min</small></div><div class="was"><span class="chg good">${pctChg(BT.avg_wait.before, BT.avg_wait.full_plan)}%</span> while serving more customers</div></div>
        <div class="tile"><div class="k">Waits over target</div><div class="v num">${fmt(BT.sla_breach_share.full_plan * 100, 1)}<small>% · was ${fmt(BT.sla_breach_share.before * 100, 1)}%</small></div><div class="was">share of served customers</div></div>
        <div class="tile"><div class="k">3 busiest days per branch</div><div class="v num">${fmt(BT.busiest_days.walkouts_after)}<small>walkouts · was ${fmt(BT.busiest_days.walkouts_before)}</small></div><div class="was"><span class="chg good">${pctChg(BT.busiest_days.walkouts_before, BT.busiest_days.walkouts_after)}%</span> on the days that matter most</div></div>
      </div>
      <div class="card" style="margin-top:14px"><h3>Walkouts per day across the network, September</h3>
        <div class="legend"><span><i class="line" style="background:var(--s-before)"></i>Status quo</span><span><i class="line" style="background:var(--s-cash)"></i>With the plan</span></div><div class="chart" id="c-bt"></div></div>
    </section>
    <section class="section">
      <div class="sechead"><span class="layer">Forecast model</span><h2>LightGBM footfall forecast</h2>
        <p>Predicts customers per branch, service and hour up to 7 days ahead from the Indian banking calendar, recent demand and booked appointments. Error is WAPE (lower is better) on September.</p></div>
      <div class="grid g-2">
        <div class="card"><h3>Forecast error vs simple rules</h3>
          <div class="tbl-wrap"><table><thead><tr><th></th><th>This model</th><th>Same day last week</th><th>Average of last 4 weeks</th></tr></thead><tbody>
            ${row("Daily total per branch", M.daily_wape)}${row("Busy days (20% above normal)", M.peak_day_wape)}${row("Per counter per hour", M.pool_hour_wape)}${row("Per service per hour", M.hourly_wape)}</tbody></table></div>
          <div class="muted" style="font-size:12px;margin-top:8px">80% of daily totals fall between ${fmt(M.daily_interval.p10 * 100, 0)}% and ${fmt(M.daily_interval.p90 * 100, 0)}% of the forecast; the plan shows this range.</div></div>
        <div class="card"><h3>What drives the forecast</h3><p class="sub">Share of TreeSHAP attribution on September</p>
          ${imp.map(([k, x]) => `<div class="themebar"><span>${esc(impLab[k] || k)}</span><span class="bar"><i style="width:${(x / imx) * 100}%;background:var(--s-cash)"></i></span><span class="num" style="text-align:right">${fmt(x * 100, 0)}%</span></div>`).join("")}</div>
      </div>
      <div class="card" style="margin-top:14px"><h3>Forecast vs actual, ${esc(BR[S.branch].name)}, September</h3>
        <div class="legend"><span><i class="line" style="background:var(--s-actual)"></i>Actual</span><span><i class="line" style="background:var(--s-model)"></i>Forecast</span><span><i class="line" style="background:var(--s-before)"></i>Same day last week</span></div><div class="chart" id="c-fa"></div></div>
    </section>
    <section class="section">
      <div class="sechead"><span class="layer">Queue model</span><h2>Fast queue model, checked against the simulation</h2></div>
      <div class="grid g-2">
        <div class="card"><p class="why ink2" style="margin:0 0 10px">Counters are modelled in 15-minute steps: backlog + Erlang-C waiting (Allen–Cunneen correction, damped because branch queues never reach steady state) + gamma-distributed patience for walkouts. It runs in milliseconds, so the optimiser can test every skill-feasible counter assignment and the what-if simulator can recompute live.</p>

        <div class="card"><h3>Data pipeline</h3><p class="sub">Synthetic token logs, rosters, appointments and feedback for 5 branches, April 2025 to September 2026</p>

    render();

  function unmount() { S.mounted = false; }

  function hourlyWait(ev, pool) {
    const e = ev[pool], out = [];
    for (let h = 0; h < 6; h++) {
      let a = 0, w = 0;
      for (let x = h * 4; x < h * 4 + 4; x++) { a += e.arr_bins[x]; w += e.arr_bins[x] * e.wait_bins[x]; }
      out.push(a > 0.2 ? w / a : e.wait_bins[h * 4]);
    }
    return out;
  }
  function summary(day, b) {
    const X = D.days[day][b], st = stateFor(day, b), bef = before(day, b);

  function approveLowRisk(day, b, who) {
    const X = D.days[day][b], ap = setOf(S.approved, day, b), dis = setOf(S.dismissed, day, b);
    let n = 0;
    X.steps.forEach((st, i) => { if (st.autopilot && !ap.has(i) && !dis.has(i)) { approve(day, b, i, who || "Sahayak (chat)"); n++; } });
    X.experience.forEach((ex, i) => { if (ex.autopilot && !setOf(S.done, day, b).has(i)) { markDone(day, b, i, who || "Sahayak (chat)"); n++; } });
    render();
    return n;
  }
  function approveAll(day, b, who) {
    const X = D.days[day][b], ap = setOf(S.approved, day, b);
    let n = 0;
    X.steps.forEach((_, i) => { if (!ap.has(i)) { approve(day, b, i, who || "Sahayak (chat)"); n++; } });
    render();
    return n;
  }
  function whatIf(day, b, opts) {
    const X = D.days[day][b];
    const m = 1 + (opts.demandPct || 0) / 100;
    const staff = {}, plan0 = {};
    Object.keys(X.home_plan).forEach((sid) => { if (!(opts.absent || []).includes(sid)) { staff[sid] = X.staff[sid]; plan0[sid] = { AM: X.staff[sid].home, PM: X.staff[sid].home }; } });
    (opts.extra || []).forEach((sid) => { const d2 = D.staff_dir[sid]; if (d2 && !staff[sid]) { staff[sid] = d2; plan0[sid] = { AM: d2.home, PM: d2.home }; } });
    for (const p of POOLS) if (!Object.values(staff).some((x) => x.home === p)) { const mid = "MGR-" + b; staff[mid] = { name: BR[b].manager, role: "Branch manager", home: p, factor: { [p]: 1.15 } }; plan0[mid] = { AM: p, PM: p }; }
    const lam = {}; Object.keys(X.lam).forEach((s2) => { lam[s2] = X.lam[s2].map((x) => x * m); });
    const dayIn = { lam, within: D.meta.within, svc_mean: D.meta.svc_mean, staff };
    const red = {};
    if (opts.withPlan) X.steps.forEach((s2) => { if (s2.effect.type === "redirect") red[s2.effect.service] = s2.effect.fraction; });
    const levers = { redirect: red, reschedule: [], lunch: "standard" };
    const plan = opts.withPlan ? Engine.optimize(dayIn, levers, plan0) : plan0;
    return Engine.evaluate(dayIn, plan, levers);
  }
  function go(tab, branch, day) { if (branch) S.branch = branch; if (day) S.day = day; if (tab) S.tab = tab; S.wi = null; persist(); render(); window.scrollTo({ top: 0 }); }
  function current() { return { day: S.day, branch: S.branch, tab: S.tab, user: S.user }; }
  function log(text, who, day, b) { addLog(text, who, day, b); }

  return { mount, unmount, render, stateFor, before, summary, hourlyWait, approveLowRisk, approveAll, whatIf, go, current, log };
})();

  const C = { user: null, lang: "en", day: D.meta.plan_days[0], branch: "B01", svc: null, hour: null, rating: 0, fbSent: null, mounted: false, apptOpen: false };
  const t = (k, v) => { let s = (T[C.lang] && T[C.lang][k]) || T.en[k] || k; if (v) for (const x in v) s = s.split("{" + x + "}").join(v[x]); return s; };
  const svcName = (id, lang) => { const s = SVCS.find((x) => x.id === id); return s ? (s[lang || C.lang] || s.en) : id; };
  const tIn = (lang, k, v) => { const keep = C.lang; C.lang = lang || keep; const r = t(k, v); C.lang = keep; return r; };
  const mins = (w) => (w < 1 ? "<1" : String(Math.round(w)));
  const hh = (h) => `${String(h).padStart(2, "0")}:00`;
  const priority = () => C.user && (C.user.age !== "18-59" || C.user.help);

  function waits(day, b, pool) { return StaffApp.hourlyWait(StaffApp.stateFor(day, b).ev, pool); }
  function level(w, pool) { const r = w / SLA[pool]; return r < 0.5 ? "q" : r < 1 ? "m" : "b"; }
  function bestHour(ws) { let bi = 0; ws.forEach((w, i) => { if (w < ws[bi] - 0.5) bi = i; }); return bi; }
  function dayOverview(day, b) {
    let worst = 0, wpool = "CASH";
    const hours = HOURS.map((_, i) => 0);
    ["CASH", "GENERAL", "EXPERT"].forEach((p) => { const ws = waits(day, b, p); ws.forEach((w, i) => { hours[i] = Math.max(hours[i], w / SLA[p]); }); const m = Math.max(...ws); if (m / SLA[p] > worst / SLA[wpool]) { worst = m; wpool = p; } });
    const bi = bestHour(hours);
    const r = worst / SLA[wpool];
    return { lvl: r < 0.5 ? "q" : r < 1 ? "m" : "b", best: `${hh(HOURS[bi])}–${hh(HOURS[bi] + 1)}` };
  }
  function neighbours(b) { return BR[b].neighbors.filter((n) => n.km <= 25); }

  function mount(root, user) {
    C.user = user; C.lang = user.lang || "en"; C.branch = user.branch || "B01"; C.mounted = true;
    C.svc = null; C.hour = null; C.fbSent = null; C.rating = 0; C.apptOpen = false;
    root.innerHTML = `<div id="cview"></div>`;
    render();
    if (window.Chat) Chat.mount({ mode: "customer", user });
  }
  function unmount() { C.mounted = false; }
  function ctx() { return { day: C.day, branch: C.branch, svc: C.svc, lang: C.lang, hour: C.hour, user: C.user }; }

  function tokenFor(day, b, svc, hourIdx) {
    const pool = D.meta.services[svc].pool;
    const X = D.days[day][b];
    let before = 0;
    Object.keys(X.lam).forEach((s) => { if (D.meta.services[s].pool === pool) for (let h = 0; h < hourIdx; h++) before += X.lam[s][h]; });
    const mine = Store.data.tokens.filter((x) => x.branch === b && x.day === day && x.pool === pool).length;
    const no = Math.round(before) + 3 + mine;
    const w = waits(day, b, pool)[hourIdx] * (priority() ? 0.35 : 1);
    const arrive = HOURS[hourIdx] * 60 + 10;
    const call = arrive + Math.max(2, Math.round(w));
    return { id: "T" + Date.now(), kind: "token", day, branch: b, svc, pool, token: `${"CGL"["CASH GENERAL EXPERT".split(" ").indexOf(pool)]}-${String(no).padStart(3, "0")}`,
      arrive: `${String(Math.floor(arrive / 60)).padStart(2, "0")}:${String(arrive % 60).padStart(2, "0")}`,
      call: `${String(Math.floor(call / 60)).padStart(2, "0")}:${String(call % 60).padStart(2, "0")}`, wait: Math.round(w), priority: !!priority(), status: "booked", mobile: C.user.mobile };
  }

  function render() {
    const v = document.getElementById("cview");
    if (!C.mounted || !v) return;
    Charts.hideTip();
    const u = C.user, b = C.branch, day = C.day;
    const ov = dayOverview(day, b);
    const mine = Store.data.tokens.filter((x) => x.mobile === u.mobile && x.status !== "cancelled");
    const closures = D.meta.closures.filter((c) => c.reason !== "Sunday").slice(0, 3);
    let detail = "";
    if (C.svc) {
      const pool = D.meta.services[C.svc].pool, red = D.meta.redirect[C.svc];
      const ws = waits(day, b, pool);
      const bi = bestHour(ws);
      if (C.hour == null) C.hour = bi;
      const mx = Math.max(...ws, SLA[pool] * 1.1);
      const canSkip = red.share > 0 && (!red.needs_digital || u.digital);
      const skipText = red.share === 0 ? "Loans and advice need a conversation with an officer. Book an appointment to skip the queue."
        : red.needs_digital && !u.digital ? `This can be done on ${red.short}, but that needs mobile or internet banking. A family member can help, or book a quiet slot below.`
          : `Most ${red.noun} requests can be done at ${red.short}. ${C.svc === "PASSBOOK" ? "The kiosk is at the entrance; no token needed, and staff will help." : C.svc === "PENSION" ? "Customers aged 80+ can ask for doorstep banking (below)." : "It takes a couple of minutes."}`;
      const near = neighbours(b).map((n) => { const w = waits(day, n.id, pool)[C.hour]; return { n, w }; });
      const hereW = ws[C.hour];
      const apptOK = ["LOAN", "ACCOUNT", "PENSION"].includes(C.svc);
      detail = `
      <div class="grid g-7-5" style="margin-top:14px">
        <div style="display:grid;gap:14px;align-content:start">
          <div class="card ${canSkip ? "skipcard" : ""}"><div class="eyebrow">${canSkip ? t("skip") : t("skipNo")}</div><p class="why" style="margin:6px 0 0;font-size:14px;color:var(--ink)">${esc(skipText)}</p></div>
          <div class="card"><h3>${t("crowd", { counter: t(pool) })}</h3><p class="sub">${esc(BR[b].name)} · ${esc(D.meta.day_labels[day])} · ${t("tap")}</p>
            <div class="hourbars" role="group" aria-label="Expected wait by hour">
              ${ws.map((w, i) => { const lv = level(w, pool); return `<button type="button" class="hb ${i === bi ? "best" : ""}" data-hour="${i}" aria-pressed="${i === C.hour}" title="${hh(HOURS[i])}: about ${mins(w)} ${t("min")}">
                <span class="hv num">${mins(w)} ${t("min")}</span><span class="col lvl-${lv}" style="height:${Math.max(6, (w / mx) * 110)}px"></span><span class="hl">${hh(HOURS[i]).slice(0, 2)}</span>${i === bi ? `<span class="chip good" style="font-size:10.5px;padding:0 6px">${t("best")}</span>` : ""}</button>`; }).join("")}
            </div>
            <div class="legend" style="margin-top:10px"><span><i class="lvl-q"></i>${t("Q")}</span><span><i class="lvl-m"></i>${t("M")}</span><span><i class="lvl-b"></i>${t("B")}</span>${priority() ? `<span class="chip acc">${t("priority")}: about a third of this wait</span>` : ""}</div>
          </div>
          <div class="card"><h3>${t("nearby", { hour: hh(HOURS[C.hour]) })}</h3>
            <div class="tbl-wrap"><table><tbody>
              <tr><td><b>${esc(BR[b].name)}</b> <span class="muted">(${t("yourBranch").toLowerCase()})</span></td><td class="r num">${mins(hereW)} ${t("min")}</td><td><span class="chip ${level(hereW, pool) === "b" ? "crit" : level(hereW, pool) === "m" ? "warn" : "good"}">${t(level(hereW, pool).toUpperCase())}</span></td></tr>
              ${near.map(({ n, w }) => `<tr><td>${esc(BR[n.id].name)} <span class="muted">${fmt(n.km, 0)} km</span></td><td class="r num">${mins(w)} ${t("min")}</td><td><span class="chip ${level(w, pool) === "b" ? "crit" : level(w, pool) === "m" ? "warn" : "good"}">${t(level(w, pool).toUpperCase())}</span></td></tr>`).join("")}
            </tbody></table></div></div>
        </div>
        <div style="display:grid;gap:14px;align-content:start">
          <div class="card"><h3>${t("bring")}</h3><ul class="ticks">${DOCS[C.svc].map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>
          <div class="card" style="display:grid;gap:10px">
            ${C.svc !== "LOAN" ? `<button class="btn primary block" type="button" id="gettoken">${t("token", { hour: hh(HOURS[C.hour]) })}</button>` : ""}
            ${apptOK ? `<button class="btn ${C.svc === "LOAN" ? "primary" : ""} block" type="button" id="openappt">${t("appt")}</button>` : ""}
            <div id="apptbox"></div>
            <div class="muted" style="font-size:12.5px">${t("sms")}</div>
          </div>
        </div>
      </div>`;
    }
    const faces = [1, 2, 3, 4, 5].map((r) => `<button type="button" class="face" data-rate="${r}" aria-pressed="${C.rating === r}" aria-label="${r} of 5">${faceSvg(r)}<span>${["Very bad", "Bad", "Okay", "Good", "Great"][r - 1]}</span></button>`).join("");
    v.innerHTML = `
    <header class="ctop"><div class="wrap brandrow">
      <a class="brand" href="#home" style="color:inherit;text-decoration:none"><div class="mark" aria-hidden="true">T-07</div><div><h1>BranchEase <span class="rolepill">Customer</span></h1><p>${esc(D.meta.bank)}</p></div></a>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="seg" role="group" aria-label="Language">${[["en", "English"], ["kn", "ಕನ್ನಡ"], ["hi", "हिंदी"]].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${C.lang === k}">${l}</button>`).join("")}</div>
        <div class="userchip"><span class="avatar" aria-hidden="true">${esc(u.name.charAt(0))}</span><span><b>${esc(u.name)}</b><br><span class="muted">${esc(u.mobile.slice(0, 2))}XXXXXX${esc(u.mobile.slice(-2))}</span></span><button type="button" class="btn small" data-logout>Log out</button></div>
      </div></div></header>
    <main class="wrap" style="padding-block:18px 90px">
      <section class="card greet">
        <div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start">
          <div style="min-width:0;flex:1 1 320px"><h2>${esc(t("hello", { name: u.name.split(" ")[0] }))}</h2>
            <p class="bigline">${esc(t("summary", { day: D.meta.day_labels[day], branch: BR[b].name, lvl: t(ov.lvl), best: ov.best }))}</p>
            ${closures.length ? `<p class="muted" style="margin:6px 0 0;font-size:13px">${t("closed")} ${closures.map((c) => `${new Date(c.date + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" })} (${esc(c.reason)})`).join(", ")}</p>` : ""}</div>
          <div style="display:grid;gap:8px;min-width:0">
            <label class="field" style="font-size:12.5px">${t("yourBranch")}<select id="cbranch">${D.branches.map((x) => `<option value="${x.id}" ${x.id === b ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
            <div class="seg" role="group" aria-label="${t("day")}">${D.meta.plan_days.map((d) => `<button type="button" data-cday="${d}" aria-pressed="${d === day}">${esc(D.meta.day_labels[d])}</button>`).join("")}</div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="sechead"><h2>${t("whatNeed")}</h2><p>${t("pick")}</p></div>
        <div class="kiosk svcgrid">${SVCS.map((s) => `<button type="button" data-svc="${s.id}" aria-pressed="${C.svc === s.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${s.icon}</svg><span class="${C.lang === "kn" ? "kn" : ""}">${esc(s[C.lang] || s.en)}</span>${C.lang !== "en" ? `<span class="kn">${esc(s.en)}</span>` : ""}</button>`).join("")}</div>
        ${detail}
      </section>

      <section class="section">
        <div class="grid g-2">
          <div class="card"><h3>${t("mine")}</h3>
            <div style="display:grid;gap:10px;margin-top:8px">${mine.length ? mine.slice().reverse().map((x) => ticket(x)).join("") : `<div class="empty">${t("none")}</div>`}</div></div>
          <div style="display:grid;gap:14px;align-content:start">
            <div class="card"><h3>${t("rate")}</h3><p class="sub">${t("rateSub")}</p>
              ${C.fbSent ? `<div class="msg" style="background:${C.fbSent <= 2 ? "var(--warn-bg)" : "var(--good-bg)"}">${C.fbSent <= 2 ? t("sorry") : t("thanks")}</div>` : `
              <div class="faces" role="group" aria-label="Rating">${faces}</div>
              <label class="field" style="margin-top:10px">${t("comment")}<textarea id="fbtext" rows="2" placeholder="e.g. waited long at the cash counter"></textarea></label>
              <button class="btn primary" type="button" id="fbsend" style="margin-top:8px" ${C.rating ? "" : "disabled"}>${t("send")}</button>`}
            </div>
            <div class="card"><h3>${t("help")}</h3>
              <div style="display:grid;gap:8px;margin-top:6px;font-size:13.5px">
                <div>${priority() ? `<span class="chip good">On</span> ${t("priority")}: your tokens go to the priority lane automatically.` : `<span class="chip">Off</span> ${t("priority")}: for customers aged 60+ or who need assistance.`}</div>
                <div><button class="btn small" type="button" id="doorstep" ${u.age === "80+" || u.help ? "" : "disabled"}>Request doorstep banking</button> <span class="muted" style="font-size:12.5px">For customers aged 80+ or with a disability</span></div>
                <div><button class="btn small" type="button" id="askbot">${t("ask")}</button> <span class="muted" style="font-size:12.5px">Chat in English, ಕನ್ನಡ or हिंदी</span></div>
              </div></div>
          </div>
        </div>
      </section>
      <div class="foot">Demo: ${esc(D.meta.bank)} and all figures are synthetic. Waits come from the same forecast and branch plan the staff dashboard uses, so a plan the manager approves changes what you see here.</div>
    </main>`;

    // events
    v.querySelectorAll("[data-lang]").forEach((x) => { x.onclick = () => { C.lang = x.dataset.lang; render(); if (window.Chat) Chat.refresh(); }; });
    v.querySelector("#cbranch").onchange = (e) => { C.branch = e.target.value; C.hour = null; render(); };
    v.querySelectorAll("[data-cday]").forEach((x) => { x.onclick = () => { C.day = x.dataset.cday; C.hour = null; render(); }; });
    v.querySelectorAll("[data-svc]").forEach((x) => { x.onclick = () => { C.svc = x.dataset.svc; C.hour = null; C.apptOpen = false; render(); document.querySelector(".hourbars")?.scrollIntoView({ block: "nearest", behavior: "smooth" }); }; });
    v.querySelectorAll("[data-hour]").forEach((x) => { x.onclick = () => { C.hour = +x.dataset.hour; render(); }; });
    const gt = v.querySelector("#gettoken");
    if (gt) gt.onclick = () => bookToken(C.svc, C.hour);
    const oa = v.querySelector("#openappt");
    if (oa) oa.onclick = () => { C.apptOpen = !C.apptOpen; render(); };
    if (C.apptOpen && C.svc) renderAppt(v.querySelector("#apptbox"));
    v.querySelectorAll("[data-cancel]").forEach((x) => { x.onclick = () => { const it = Store.data.tokens.find((k) => k.id === x.dataset.cancel); if (it) { it.status = "cancelled"; Store.save(); UI.toast("Cancelled"); render(); } }; });
    v.querySelectorAll("[data-rate]").forEach((x) => { x.onclick = () => { C.rating = +x.dataset.rate; render(); }; });
    const fs = v.querySelector("#fbsend");
    if (fs) fs.onclick = () => {
      const txt = (v.querySelector("#fbtext").value || "").trim().slice(0, 400);
      const now = new Date();
      Store.data.feedback.push({ branch: C.branch, rating: C.rating, comment: txt, service: C.svc ? svcName(C.svc) : "", senior: C.user.age !== "18-59", time: `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`, at: now.toISOString() });
      Store.save();
      if (C.rating <= 2 && window.StaffApp) StaffApp.log(`Low rating (${C.rating}★) from a customer in the app: floor manager alerted`, "Customer app", StaffApp.current().day, C.branch);
      C.fbSent = C.rating; render();
    };
    const ds = v.querySelector("#doorstep");
    if (ds) ds.onclick = () => { Store.data.requests.push({ type: "doorstep", branch: C.branch, mobile: C.user.mobile, at: new Date().toISOString() }); Store.save(); if (window.StaffApp) StaffApp.log("Doorstep banking requested by a customer (80+ / assistance)", "Customer app", StaffApp.current().day, C.branch); UI.toast("Request sent. The branch will call you to fix a time."); ds.disabled = true; };
    v.querySelector("#askbot").onclick = () => { if (window.Chat) Chat.open(); };
  }

  function ticket(x) {
    const when = D.meta.day_labels[x.day] || x.day;
    if (x.kind === "appt") return `<div class="ticket"><div class="tno mono">${esc(x.slot)}</div><div style="min-width:0"><div><b>${esc(svcName(x.svc))}</b> · appointment</div><div class="muted" style="font-size:12.5px">${esc(BR[x.branch].name)} · ${esc(when)} · ${t(x.pool)} · served first, expected wait under 5 ${t("min")}</div><div style="margin-top:6px"><button class="btn small" type="button" data-cancel="${x.id}">${t("cancel")}</button></div></div></div>`;
    return `<div class="ticket"><div class="tno mono" style="color:var(--s-${x.pool === "CASH" ? "cash" : x.pool === "GENERAL" ? "gen" : "exp"})">${esc(x.token)}</div><div style="min-width:0"><div><b>${esc(svcName(x.svc))}</b>${x.priority ? ` <span class="chip acc">${t("priority")}</span>` : ""}</div><div class="muted" style="font-size:12.5px">${esc(BR[x.branch].name)} · ${esc(when)} · ${t(x.pool)} · arrive ${esc(x.arrive)} · ${t("callAt")} ${esc(x.call)}</div><div style="margin-top:6px"><button class="btn small" type="button" data-cancel="${x.id}">${t("cancel")}</button></div></div></div>`;
  }

  function bookToken(svc, hourIdx) {
    const tk = tokenFor(C.day, C.branch, svc, hourIdx);
    Store.data.tokens.push(tk); Store.save();
    UI.toast(`Token ${tk.token} booked for ${D.meta.day_labels[C.day]}`);
    render();
    return tk;
  }
  function renderAppt(box) {
    const pool = D.meta.services[C.svc].pool;
    const ws = waits(C.day, C.branch, pool);
    const slots = [];
    for (let h = 0; h < 6; h++) for (const m of [0, 30]) slots.push({ label: `${String(HOURS[h]).padStart(2, "0")}:${m ? "30" : "00"}`, w: ws[h], h });
    const minW = Math.min(...slots.map((s) => s.w));
    box.innerHTML = `<div class="eyebrow" style="margin:4px 0 6px">Choose a slot · ${esc(D.meta.day_labels[C.day])}</div><div class="slots">${slots.map((s) => `<button type="button" class="slot ${s.w <= minW + 1 ? "rec" : ""}" data-slot="${s.label}|${s.h}">${s.label}<small>${s.w <= minW + 1 ? "quiet" : level(s.w, pool) === "b" ? "busy" : "ok"}</small></button>`).join("")}</div>`;
    box.querySelectorAll("[data-slot]").forEach((x) => { x.onclick = () => {
      const [label, h] = x.dataset.slot.split("|");
      Store.data.tokens.push({ id: "A" + Date.now(), kind: "appt", day: C.day, branch: C.branch, svc: C.svc, pool, slot: label, hour: +h, status: "booked", mobile: C.user.mobile });
      Store.save(); C.apptOpen = false; UI.toast(`Appointment booked at ${label}`); render();
    }; });
  }
  function faceSvg(r) {
    const mouth = { 1: "M8 16c1.2-1.6 2.5-2.2 4-2.2s2.8.6 4 2.2", 2: "M8.5 15.5c1-.8 2.1-1.1 3.5-1.1s2.5.3 3.5 1.1", 3: "M8.5 15h7", 4: "M8.5 14.5c1 .8 2.1 1.1 3.5 1.1s2.5-.3 3.5-1.1", 5: "M8 14c1.2 1.8 2.5 2.4 4 2.4s2.8-.6 4-2.4" }[r];
    return `<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".9" fill="currentColor"/><circle cx="15" cy="10" r=".9" fill="currentColor"/><path d="${mouth}"/></svg>`;
  }

  // for the chatbot
  function api() {
    return { ctx, waits, level, bestHour, svcName, DOCS, SVCS, t: (k, v, lang) => tIn(lang, k, v), neighbours, hh, HOURS, mins,
      setService: (s) => { C.svc = s; C.hour = null; render(); },
      setLang: (l) => { C.lang = l; render(); },
      book: (svc, hourIdx) => bookToken(svc, hourIdx == null ? bestHour(waits(C.day, C.branch, D.meta.services[svc].pool)) : hourIdx),
      priority };
  }
  return { mount, unmount, render, ctx, api };
})();

</script>
<script>
/* Sahayak chatbot. Rule-based intents answered from the forecast and plan (works offline, EN / KN / HI,
   including Kannada or Hindi typed in English letters). When the page runs inside a Claude viewer that grants
   the `sample` capability, questions the rules don't cover go to Claude with the same data as context. */
window.Chat = (function () {
  "use strict";
  const D = window.DATA;
  const fmt = Charts.fmt;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const BR = Object.fromEntries(D.branches.map((b) => [b.id, b]));
  const PL = D.meta.pool_label, SLA = D.meta.sla;
  const HOURS = [10, 11, 12, 13, 14, 15];
  const hh = (h) => `${String(h).padStart(2, "0")}:00`;

  const st = { mode: null, user: null, open: false, msgs: [], turns: [], ai: null, busy: false, ctl: null, acts: {}, seq: 0 };

  // ------------------------------------------------------------ language
  const KN_WORDS = /\b(ide|ideya|idya|beku|madbeku|maadbeku|yavaga|eshtu|hege|illa|nimisha|sarathi|jana|barbeku|hogbeku|namaskara|dhanyavada|shakhe)\b/;
  const HI_WORDS = /\b(kitna|kitni|kab|kya|hai|chahiye|kaise|bheed|karna|karni|jana|jaana|mujhe|namaste|shukriya|dhanyavaad|bataiye|batao|kaun)\b/;
  function detectLang(text, fallback) {
    if (/[ಀ-೿]/.test(text)) return "kn";
    if (/[ऀ-ॿ]/.test(text)) return "hi";
    const t = text.toLowerCase();
    if (KN_WORDS.test(t)) return "kn";
    if (HI_WORDS.test(t)) return "hi";
    return fallback || "en";
  }
  const L = {
    en: {
      hi: "Hello{name}! I'm Sahayak. Ask me how busy the branch will be, the best time to go, what to bring, or book a token.",
      svcQ: "Which service is it for?",

  const tr = (lang, k, v) => { let s = (L[lang] && L[lang][k]) || L.en[k]; for (const x in v || {}) s = s.split("{" + x + "}").join(v[x]); return s; };

  const SVC_RE = {
    PENSION: /pension|life certificate|life cert|jeevan pra|pinchan|ಪಿಂಚಣಿ|ಜೀವನ|पेंशन|जीवन प्रमाण/,
    PASSBOOK: /passbook|pass book|\bpb\b|balance|ಪಾಸ್|ಬಾಕಿ|पासबुक|बैलेंस/,
    ACCOUNT: /kyc|account open|new account|mobile number|mobile no|address|nominee|aadhaar|ಕೆವೈಸಿ|ಖಾತೆ|केवाईसी|खाता|पता/,
    REMIT: /\bdd\b|demand draft|neft|rtgs|transfer|cheque|\bchq\b|ಡಿಡಿ|ಚೆಕ್|डीडी|चेक|ट्रांसफर/,
    LOAN: /loan|\bfd\b|fixed deposit|gold loan|home loan|\bkcc\b|advice|\bnri\b|ಸಾಲ|ऋण|लोन/,
    CASH: /cash|withdraw|deposit|nagadu|nakad|paisa|paise|ನಗದು|ಹಣ|नकद|पैसा/,
  };
  function findService(t) { for (const k of Object.keys(SVC_RE)) if (SVC_RE[k].test(t)) return k; return null; }
  function findBranch(t) { const b = D.branches.find((x) => t.includes(x.name.toLowerCase())); return b ? b.id : null; }
  function findDay(t) {
    const days = D.meta.plan_days;
    if (/tomorrow|naale|kal\b|ನಾಳೆ|कल/.test(t)) return days[0];
    const names = { mon: 1, tue: 2, wed: 3, thu: 4, sat: 6 };
    for (const d of days) {
      const dt = new Date(d + "T00:00:00"), wd = dt.getDay();
      const nm = Object.keys(names).find((k) => names[k] === wd);
      if (nm && new RegExp("\\b" + nm).test(t)) return d;
      if (new RegExp("\\b" + dt.getDate() + "\\s*(oct|october)?\\b").test(t) && /oct|october|\b\d{1,2}\s*(st|nd|rd|th)\b/.test(t)) return d;
    }
    return null;
  }

  // ------------------------------------------------------------ rendering
  const root = () => document.getElementById("chatroot");
  function render() {
    const r = root();
    if (!r) return;
    if (!st.mode) { r.innerHTML = ""; return; }
    const staff = st.mode === "staff";
    r.innerHTML = `
      <button type="button" class="chatfab" id="chatfab" aria-label="${st.open ? "Close chat" : "Open Sahayak chat"}" aria-expanded="${st.open}">
        ${st.open ? '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
        : '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4Z"/><path d="M8 10h8M8 13h5" stroke-linecap="round"/></svg>'}
        ${st.open ? "" : '<span class="fablabel">Sahayak</span>'}
      </button>
      ${st.open ? `<section class="chatpanel" role="dialog" aria-label="Sahayak chat">
        <div class="chathead"><div class="avatar" aria-hidden="true">S</div><div style="flex:1;min-width:0"><b>Sahayak</b> ${st.ai ? '<span class="chip acc" style="font-size:10.5px">AI on</span>' : ""}<div class="muted" style="font-size:12px">${staff ? "Ask about tomorrow's plan, alerts, what-ifs" : "Waits, tokens, documents · English, ಕನ್ನಡ, हिंदी"}</div></div>
          <button type="button" class="btn small" id="chatclose" aria-label="Close chat">Close</button></div>
        <div class="chatlog" id="chatlog" aria-live="polite">${st.msgs.map((m, i) => `<div class="bub ${m.from}">${m.html}</div>${m.chips && i === st.msgs.length - 1 ? `<div class="chips2">${m.chips.map((c) => `<button type="button" data-act="${c.id}">${esc(c.label)}</button>`).join("")}</div>` : ""}`).join("")}
          ${st.busy ? `<div class="bub bot thinking">Thinking… <button type="button" class="linkbtn" id="chatstop">Stop</button></div>` : ""}</div>
        <form class="chatform" id="chatform"><input id="chatin" autocomplete="off" placeholder="${staff ? "e.g. why is tomorrow busy?" : "e.g. naale cash ge eshtu rush ide?"}" aria-label="Message"><button class="btn primary" type="submit">Send</button></form>
      </section>` : ""}`;
    r.querySelector("#chatfab").onclick = () => { st.open = !st.open; render(); if (st.open) focusIn(); };
    if (!st.open) return;
    r.querySelector("#chatclose").onclick = () => { st.open = false; render(); };
    const log = r.querySelector("#chatlog"); log.scrollTop = log.scrollHeight;
    r.querySelectorAll("[data-act]").forEach((b) => { b.onclick = () => { const a = st.acts[b.dataset.act]; if (a) { me(esc(a.label)); a.fn(); } }; });
    r.querySelector("#chatform").onsubmit = (e) => { e.preventDefault(); const v = r.querySelector("#chatin").value.trim(); if (!v || st.busy) return; me(esc(v)); handle(v); };
    const stop = r.querySelector("#chatstop");
    if (stop) stop.onclick = () => st.ctl && st.ctl.abort();
  }
  function focusIn() { const i = document.getElementById("chatin"); if (i) i.focus(); }
  function chip(label, fn) { const id = "a" + (++st.seq); st.acts[id] = { label, fn }; return { id, label }; }
  function bot(html, chips) { st.msgs.push({ from: "bot", html, chips }); render(); }
  function me(html) { st.msgs.push({ from: "me", html }); render(); }

  // ------------------------------------------------------------ customer brain
  function cApi() { return CustomerApp.api(); }
  function serviceOverview(svc, lang, dayOverride, branchOverride) {
    const A = cApi(), c = A.ctx();
    const day = dayOverride || c.day, b = branchOverride || c.branch;
    const pool = D.meta.services[svc].pool;
    const ws = A.waits(day, b, pool);
    const bi = A.bestHour(ws);
    let pi = 0; ws.forEach((w, i) => { if (w > ws[pi]) pi = i; });
    const red = D.meta.redirect[svc];
    const lines = [tr(lang, "over", { svc: esc(A.svcName(svc, lang)), branch: esc(BR[b].name), day: esc(D.meta.day_labels[day]), counter: esc(A.t(pool, null, lang)), best: hh(HOURS[bi]), bw: A.mins(ws[bi]), peak: hh(HOURS[pi]), pw: A.mins(ws[pi]) })];
    if (red.share > 0 && (!red.needs_digital || c.user.digital)) lines.push(tr(lang, "skipY", { how: esc(red.short) }));
    else if (red.share === 0) lines.push(tr(lang, "skipN"));
    lines.push(tr(lang, "bring", { docs: esc(A.DOCS[svc].join(", ")) }));
    if (A.priority()) lines.push(lang === "kn" ? "ನಿಮಗೆ ಆದ್ಯತೆಯ ಸಾಲು ಸಿಗುತ್ತದೆ, ಕಾಯುವ ಸಮಯ ಕಡಿಮೆ." : lang === "hi" ? "आपको प्राथमिकता कतार मिलेगी, इंतज़ार कम होगा।" : "You get the priority lane, so your wait is shorter.");
    return { html: lines.join("<br><br>"), best: bi, day, b };
  }
  function customerTurn(text) {
    const A = cApi(), c = A.ctx();
    const t = text.toLowerCase();
    const lang = detectLang(text, c.lang);
    const svc = findService(t);
    const day = findDay(t) || c.day;
    const b = findBranch(t) || c.branch;
    const svcChips = () => A.SVCS.map((s) => chip(s[lang] || s.en, () => { A.setService(s.id); const o = serviceOverview(s.id, lang); bot(o.html, bookChips(s.id, o.best, lang)); }));
    if (/^(hi|hello|hey|namaskara|namaskar|namaste|ನಮಸ್ಕಾರ|नमस्ते)\b/.test(t) && t.length < 25) return bot(tr(lang, "hi", { name: ", " + esc(c.user.name.split(" ")[0]) }), svcChips()), true;
    if (/thank|dhanyavad|shukriya|ಧನ್ಯವಾದ|धन्यवाद/.test(t)) return bot(tr(lang, "thanks")), true;
    if (/\b(kannada|ಕನ್ನಡ)\b/.test(t) && t.length < 30) { A.setLang("kn"); return bot(tr("kn", "hi", { name: "" })), true; }
    if (/\b(hindi|हिंदी)\b/.test(t) && t.length < 30) { A.setLang("hi"); return bot(tr("hi", "hi", { name: "" })), true; }
    if (/\benglish\b/.test(t) && t.length < 30) { A.setLang("en"); return bot(tr("en", "hi", { name: "" })), true; }
    if (/human|agent|person|call me|talk to (someone|staff|manager)|manager|helpdesk/.test(t)) return bot(tr(lang, "human")), true;
    if (/complain|feedback|rude|bad service|problem|shikayat|ದೂರು|शिकायत/.test(t)) return bot(tr(lang, "fb"), [chip(lang === "kn" ? "ಹೌದು, ತಿಳಿಸಿ" : lang === "hi" ? "हाँ, सूचना दें" : "Yes, alert the manager", () => {
      Store.data.feedback.push({ branch: c.branch, rating: 1, comment: "Complaint raised through the Sahayak chat: " + text.slice(0, 200), service: svc ? A.svcName(svc) : "", senior: c.user.age !== "18-59", time: new Date().toTimeString().slice(0, 5), at: new Date().toISOString() });
      Store.save(); if (window.StaffApp) StaffApp.log("Customer complaint raised through the chat: manager alerted", "Sahayak (customer chat)", StaffApp.current().day, c.branch);
      bot(tr(lang, "alerted"));
    })]), true;
    if (/open|closed|close|holiday|timing|hours|band|chutti|raje|ರಜೆ|छुट्टी|बंद/.test(t)) {
      const list = D.meta.closures.slice(0, 5).map((x) => `${new Date(x.date + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" })} (${x.reason})`).join(", ");
      return bot(tr(lang, "closed", { list: esc(list) })), true;
    }
    if (/token|book|appointment|slot|virtual|from home/.test(t)) {
      if (!svc) return bot(tr(lang, "svcQ"), svcChips()), true;
      const pool = D.meta.services[svc].pool, ws = A.waits(day, b, pool), bi = A.bestHour(ws);
      if (svc === "LOAN") { A.setService(svc); return bot((lang === "en" ? "Loans need an appointment. I've opened the loans section on the page; pick a quiet slot there." : lang === "kn" ? "ಸಾಲಕ್ಕೆ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಬೇಕು. ಪುಟದಲ್ಲಿ ಕಡಿಮೆ ಜನರಿರುವ ಸಮಯ ಆಯ್ಕೆಮಾಡಿ." : "ऋण के लिए अपॉइंटमेंट चाहिए। पेज पर कम भीड़ वाला समय चुनें।")), true; }
      return bot(tr(lang, "bookQ", { svc: esc(A.svcName(svc, lang)), best: hh(HOURS[bi]) }), bookChips(svc, bi, lang)), true;
    }
    if (/document|bring|papers|proof|dakhale|dastavez|kagaz|ದಾಖಲೆ|दस्तावेज़|क्या लाना/.test(t)) {
      if (!svc) return bot(tr(lang, "svcQ"), svcChips()), true;
      return bot(tr(lang, "bring", { docs: esc(A.DOCS[svc].join(", ")) })), true;
    }
    if (/nearby|other branch|another branch|less (crowd|busy)|\bnear\b|bere shakhe|dusri shakha/.test(t)) {
      const pool = svc ? D.meta.services[svc].pool : "CASH";
      const hIdx = c.hour != null ? c.hour : 1;
      const rows = [b, ...A.neighbours(b).map((n) => n.id)].map((id) => `${esc(BR[id].name)} ~${A.mins(A.waits(day, id, pool)[hIdx])} min`).join(", ");
      return bot(tr(lang, "near", { hour: hh(HOURS[hIdx]), counter: esc(A.t(pool, null, lang)), list: rows })), true;
    }
    if (svc) { A.setService(svc); const o = serviceOverview(svc, lang, day, b); return bot(o.html, bookChips(svc, o.best, lang)), true; }
    if (/wait|crowd|rush|busy|queue|line|bheed|how long|kitna|eshtu|jana|best time|when|quiet|yavaga|\bkab\b|ಯಾವಾಗ|ಎಷ್ಟು|कितना|कब|भीड़|ಜನ/.test(t)) {
      let worst = { w: -1 }, bestIdx = 0;
      const agg = HOURS.map(() => 0);
      ["CASH", "GENERAL", "EXPERT"].forEach((p) => { const ws = A.waits(day, b, p); ws.forEach((w, i) => { agg[i] = Math.max(agg[i], w / SLA[p]); if (w / SLA[p] > worst.w / (SLA[worst.p] || 1)) worst = { w, p, i }; }); });
      agg.forEach((v, i) => { if (v < agg[bestIdx]) bestIdx = i; });
      return bot(tr(lang, "day", { day: esc(D.meta.day_labels[day]), branch: esc(BR[b].name), counter: esc(A.t(worst.p, null, lang)), pw: A.mins(worst.w), peak: hh(HOURS[worst.i]), best: `${hh(HOURS[bestIdx])}–${hh(HOURS[bestIdx] + 1)}` }) + "<br><br>" + tr(lang, "svcQ"), svcChips()), true;
    }
    if (/help|what can you|madad|sahaya|ಸಹಾಯ|मदद/.test(t)) return bot(tr(lang, "hi", { name: "" }), svcChips()), true;
    return false;
  }
  function bookChips(svc, bi, lang) {
    const A = cApi();
    if (svc === "LOAN") return [];
    return [chip((lang === "kn" ? "ಟೋಕನ್ ಬುಕ್ ಮಾಡಿ " : lang === "hi" ? "टोकन बुक करें " : "Book token for ") + hh(HOURS[bi]), () => {
      const tk = A.book(svc, bi);
      bot(tr(lang, "booked", { tok: esc(tk.token), day: esc(D.meta.day_labels[tk.day]), arr: tk.arrive, call: tk.call }));
    })];
  }

  // ------------------------------------------------------------ staff brain
  function staffTurn(text) {
    const t = text.toLowerCase();
    const cur = StaffApp.current();
    const day = findDay(t) || cur.day, b = findBranch(t) || cur.branch;
    const S = StaffApp.summary(day, b), X = S.X, E = X.explain;
    const nm = BR[b].name, dl = D.meta.day_labels[day];
    const role = (cur.user || {}).role;
    const nav = [chip("Open the plan", () => StaffApp.go("plan", b, day)), chip("What-if simulator", () => StaffApp.go("whatif", b, day))];
    if (/^(hi|hello|hey|namaskara|namaste)\b/.test(t) || /\bhelp\b|what can you/.test(t))
      return bot(`Hello ${esc((cur.user || {}).name || "")}. I can explain the forecast, list alerts, summarise the plan, run a what-if ("what if demand is 20% higher?", "what if Ravi is on leave?"), compare branches, and approve low-risk actions for you.`,
        [chip("Why is tomorrow busy?", () => staffTurn("why busy")), chip("Show alerts", () => staffTurn("alerts")), chip("What should I do?", () => staffTurn("recommend"))]), true;
    if (/approve/.test(t)) {
      if (role === "counter") return bot("Only the branch manager or regional office can approve actions. I can show you the plan instead.", nav), true;
      const all = /all|everything|full/.test(t) && !/low|safe/.test(t);
      const n = all ? X.steps.filter((_, i) => !S.approved.includes(i)).length : X.steps.filter((s2, i) => s2.autopilot && !S.approved.includes(i) && !S.dismissed.includes(i)).length + X.experience.filter((x) => x.autopilot).length;
      return bot(`${all ? "Approve all" : "Approve the low-risk"} actions for ${esc(nm)} on ${esc(dl)}? That is ${n} ${n === 1 ? "item" : "items"}${all ? ", including staff moves" : " (token-machine prompts, appointment offers, checklists)"}.`,
        [chip("Yes, approve", () => { const k = all ? StaffApp.approveAll(day, b) : StaffApp.approveLowRisk(day, b); const s2 = StaffApp.summary(day, b); bot(`Approved ${k}. Average wait is now ${fmt(s2.now.avg_wait, 1)} min (was ${fmt(s2.was.avg_wait, 1)}), about ${Math.round(s2.now.walkouts)} walkouts expected (was ${Math.round(s2.was.walkouts)}).`); }), chip("Not now", () => bot("Okay, nothing approved."))]), true;
    }
    if (/what if|what-if|if .*(absent|leave|off|sick)|demand|busier|quieter|\d+\s*%/.test(t)) {
      const pm = t.match(/([+-]?\d+)\s*%/);
      let pct = pm ? +pm[1] : 0;
      if (pm && /(less|lower|quieter|fewer|down|drop)/.test(t) && pct > 0) pct = -pct;
      const absent = Object.entries(D.staff_dir).filter(([id, s2]) => s2.branch === b && t.includes(s2.name.split(" ")[0].toLowerCase())).map(([id]) => id);
      if (!pm && !absent.length) return bot(`Tell me what to change, for example "what if demand is 20% higher" or "what if ${esc(D.staff_dir[Object.keys(X.home_plan).find((k) => !k.startsWith("MGR"))].name.split(" ")[0])} is on leave".`), true;
      const noPlan = StaffApp.whatIf(day, b, { demandPct: pct, absent, withPlan: false })._branch;
      const withPlan = StaffApp.whatIf(day, b, { demandPct: pct, absent, withPlan: true })._branch;
      const desc = [pct ? `demand ${pct > 0 ? "+" : ""}${pct}%` : "", absent.length ? absent.map((id) => D.staff_dir[id].name).join(", ") + " away" : ""].filter(Boolean).join(" and ");
      return bot(`What-if for ${esc(nm)}, ${esc(dl)} (${esc(desc)}):<br>• Doing nothing: average wait ${fmt(noPlan.avg_wait, 1)} min, worst hour ${fmt(noPlan.peak_wait, 0)} min, about ${Math.round(noPlan.walkouts)} walkouts.<br>• With self-service guidance and re-planned counters: ${fmt(withPlan.avg_wait, 1)} min, worst hour ${fmt(withPlan.peak_wait, 0)} min, about ${Math.round(withPlan.walkouts)} walkouts.<br><br>Today's plan as forecast: ${fmt(S.was.avg_wait, 1)} min doing nothing.`, [chip("Open what-if simulator", () => StaffApp.go("whatif", b, day))]), true;
    }
    if (/why|reason|explain|driver|kyun|yake/.test(t) || (/busy/.test(t) && !/which/.test(t))) {
      const pct = Math.round((E.total / E.normal - 1) * 100);
      const drv = E.drivers.filter((d2) => Math.abs(d2.value) >= 2).map((d2) => `• ${esc(d2.label)}: ${d2.value > 0 ? "+" : "−"}${Math.round(Math.abs(d2.value))}`).join("<br>");
      return bot(`${esc(nm)} expects <b>${Math.round(E.total)}</b> customers on ${esc(dl)}, ${pct >= 0 ? "+" : "−"}${Math.abs(pct)}% vs a normal day (${Math.round(E.normal)}). Why:<br>${drv || "• No special calendar events."}<br><br>Likely range ${E.low}–${E.high}.`, [chip("Show alerts", () => staffTurn(`alerts ${nm}`)), chip("What should I do?", () => staffTurn(`recommend ${nm}`))]), true;
    }
    if (/alert|bottleneck|worst|problem|which counter|queue/.test(t)) {
      if (!X.alerts.length) return bot(`No counter at ${esc(nm)} is expected to go over its wait target on ${esc(dl)}.`), true;
      return bot(`${X.alerts.length} ${X.alerts.length === 1 ? "alert" : "alerts"} at ${esc(nm)} on ${esc(dl)}:<br>${X.alerts.map((a) => `• <b>${esc(a.title)}</b> (${a.severity}). ${esc(a.causes[0])}`).join("<br>")}`, [chip("What should I do?", () => staffTurn(`recommend ${nm}`))]), true;
    }
    if (/recommend|suggest|what should|\bplan\b|action|to do|fix/.test(t)) {
      if (!X.steps.length) return bot(`No queue actions are needed at ${esc(nm)} on ${esc(dl)}.`), true;
      const lines = X.steps.map((s2, i) => `${i + 1}. ${esc(s2.title)} (${fmt(s2.impact.avg_wait_before, 1)} → ${fmt(s2.impact.avg_wait_after, 1)} min)${S.approved.includes(i) ? " ✓" : ""}`).join("<br>");
      const ch = role === "counter" ? nav : [chip("Approve low-risk ones", () => staffTurn(`approve low risk ${nm}`)), chip("Approve all", () => staffTurn(`approve all ${nm}`)), nav[0]];
      return bot(`Recommended plan for ${esc(nm)}, ${esc(dl)}:<br>${lines}<br><br>Full plan: average wait ${fmt(X.kpi_before.avg_wait, 1)} → ${fmt(X.kpi_after.avg_wait, 1)} min, walkouts ${Math.round(X.kpi_before.walkouts)} → ${Math.round(X.kpi_after.walkouts)}.`, ch), true;
    }
    if (/walk ?out|average|kpi|how (many|long)|wait/.test(t)) {
      return bot(`${esc(nm)}, ${esc(dl)}, with the actions approved so far: average wait <b>${fmt(S.now.avg_wait, 1)} min</b> (doing nothing: ${fmt(S.was.avg_wait, 1)}), worst hour ${fmt(S.now.peak_wait, 0)} min, about ${Math.round(S.now.walkouts)} walkouts (doing nothing: ${Math.round(S.was.walkouts)}).`), true;
    }
    if (/leave|absent|who is|on duty|roster|staff|lent|borrow/.test(t) && !/network|compare/.test(t)) {
      const away = X.absent.map((a) => `${esc(a.name)} (${esc(a.reason || a.status)})`).join(", ") || "nobody";
      const lent = (D.network[day] || []).filter((m) => m.to_branch === b || m.from_branch === b).map((m) => `${esc(m.name)}: ${esc(BR[m.from_branch].name)} → ${esc(BR[m.to_branch].name)} (${m.blocks.length === 2 ? "all day" : "morning"})`).join("; ");
      return bot(`${esc(nm)} on ${esc(dl)}: ${Object.keys(X.home_plan).filter((k) => !k.startsWith("MGR")).length} staff on duty; away: ${away}.${lent ? "<br>Suggested lending: " + lent + "." : ""}`), true;
    }
    if (/network|compare|all branches|other branches|region/.test(t)) {
      const rows = D.branches.map((br) => { const s2 = StaffApp.summary(day, br.id); const a = D.days[day][br.id].alerts; return `• ${esc(br.name)}: ${Math.round(D.days[day][br.id].explain.total)} customers, ${a.length} ${a.length === 1 ? "alert" : "alerts"}, avg wait ${fmt(s2.now.avg_wait, 1)} min`; }).join("<br>");
      return bot(`Network on ${esc(dl)}:<br>${rows}`, [chip("Open network view", () => StaffApp.go("network", null, day))]), true;
    }
    if (/feedback|complain|rating|customers (say|saying)|theme/.test(t)) {
      const F = D.feedback.branches[b];
      const top = Object.entries(F.themes).slice(0, 3).map(([k, n]) => `${esc(D.feedback.theme_labels[k] || k)} (${n})`).join(", ");
      const app = Store.data.feedback.filter((f) => f.branch === b && f.rating <= 2).length;
      return bot(`${esc(nm)} feedback in September: average ${fmt(F.avg_rating, 2)} of 5, ${fmt(F.negative_share * 100, 1)}% negative. Top complaints: ${top}.${app ? `<br>${app} low ${app === 1 ? "rating" : "ratings"} from the customer app today.` : ""}`, [chip("Open customer voice", () => StaffApp.go("voice", b, day))]), true;
    }
    if (/accura|model|error|backtest|proof|validat|test/.test(t)) {
      const M = D.model.metrics, BT = D.backtest.summary;
      return bot(`Forecast error on held-out September: ${fmt(M.daily_wape.model * 100, 1)}% per branch-day (vs ${fmt(M.daily_wape.seasonal_naive * 100, 1)}% for "same day last week"). Replaying the same customers with the plan: walkouts ${fmt(BT.walkouts.before)} → ${fmt(BT.walkouts.full_plan)}, waits over target ${fmt(BT.sla_breach_share.before * 100, 1)}% → ${fmt(BT.sla_breach_share.full_plan * 100, 1)}%.`, [chip("Open model & data", () => StaffApp.go("model"))]), true;
    }
    return false;
  }

  // ------------------------------------------------------------ AI fallback
  function aiContext() {
    if (st.mode === "customer") {
      const A = cApi(), c = A.ctx();
      const services = {};
      A.SVCS.forEach((s) => {
        const pool = D.meta.services[s.id].pool, r = D.meta.redirect[s.id];
        services[s.id] = { name: s.en, counter: PL[pool], can_skip_visit: r.share > 0 ? r.short + (r.needs_digital ? " (needs mobile/internet banking)" : "") : "no", documents: A.DOCS[s.id],
          expected_wait_minutes_by_hour_10_to_15: Object.fromEntries([c.branch, ...A.neighbours(c.branch).map((n) => n.id)].map((b) => [BR[b].name, A.waits(c.day, b, pool).map((w) => Math.round(w))])) };
      });
      return { app: "BranchEase customer app for Demo Bank (fictional)", today: D.meta.today, selected_day: D.meta.day_labels[c.day], customer: { first_name: c.user.name.split(" ")[0], home_branch: BR[c.branch].name, uses_mobile_banking: c.user.digital, priority_lane: A.priority() },
        branch_hours: D.meta.hours, upcoming_closures: D.meta.closures.slice(0, 6), services };
    }
    const cur = StaffApp.current(), S = StaffApp.summary(cur.day, cur.branch), X = S.X;
    return { app: "BranchEase staff dashboard (fictional bank)", user_role: (cur.user || {}).role, day: D.meta.day_labels[cur.day], branch: BR[cur.branch].name,
      forecast: { total: Math.round(X.explain.total), normal_day: Math.round(X.explain.normal), drivers: X.explain.drivers.map((d2) => `${d2.label}: ${Math.round(d2.value)}`) },
      alerts: X.alerts.map((a) => ({ title: a.title, causes: a.causes })), plan: X.steps.map((s2, i) => ({ step: s2.title, avg_wait: `${s2.impact.avg_wait_before} -> ${s2.impact.avg_wait_after}`, approved: S.approved.includes(i), owner: s2.owner })),
      now: { avg_wait: +S.now.avg_wait.toFixed(1), walkouts: Math.round(S.now.walkouts) }, doing_nothing: { avg_wait: +S.was.avg_wait.toFixed(1), walkouts: Math.round(S.was.walkouts) },
      staff_away: X.absent.map((a) => `${a.name} (${a.reason || a.status})`),
      network: D.branches.map((br) => ({ branch: br.name, customers: Math.round(D.days[cur.day][br.id].explain.total), alerts: D.days[cur.day][br.id].alerts.length })),
      feedback_top_complaints: Object.keys(D.feedback.branches[cur.branch].themes).slice(0, 4).map((k) => D.feedback.theme_labels[k]) };
  }
  async function askAI(text) {
    const lang = st.mode === "customer" ? detectLang(text, cApi().ctx().lang) : "en";
    const langName = { en: "English", kn: "Kannada (ಕನ್ನಡ script)", hi: "Hindi (Devanagari script)" }[lang];
    const rules = `You are Sahayak, the assistant inside BranchEase, a hackathon demo for a fictional bank. Answer using ONLY the JSON data below; if it does not cover the question, say so briefly and suggest what the user can do in the app. Be warm, practical and short (under 90 words, plain text, no markdown). Reply in ${langName}. Never ask for account numbers, OTPs, PINs or passwords.\n\nDATA:\n${JSON.stringify(aiContext())}`;
    st.turns.push({ role: "user", content: text });
    const turns = [{ role: "user", content: rules }, ...st.turns.slice(-8)];
    st.busy = true; st.ctl = new AbortController(); render();
    const idx = st.msgs.length;
    try {
      await st.ai(turns, { modelTier: "quick", cache: false, signal: st.ctl.signal, onText: ({ text: tx }) => { st.busy = false; st.msgs[idx] = { from: "bot", html: esc(tx) }; render(); } });
      st.turns.push({ role: "assistant", content: st.msgs[idx] ? st.msgs[idx].html : "" });
    } catch (e) {
      st.busy = false;
      if (e && e.code === "cancelled") { if (!st.msgs[idx]) bot("Stopped."); }
      else if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { st.ai = null; fallback(text); }
      else if (e && e.code === "rate_limited") bot("I'm getting a lot of questions right now. Please try again in a minute.");
      else fallback(text);
    } finally { st.busy = false; render(); }
  }
  function fallback(text) {
    if (st.mode === "customer") { const lang = detectLang(text, cApi().ctx().lang); bot(tr(lang, "miss"), cApi().SVCS.slice(0, 3).map((s) => chip(s[lang] || s.en, () => customerTurn(s.en)))); }
    else bot(`I can help with: why a day is busy, alerts, the recommended plan, what-ifs, staff on leave, the network, feedback and model accuracy. Try "what if demand is 20% higher?"`, [chip("Why is tomorrow busy?", () => staffTurn("why busy")), chip("Show alerts", () => staffTurn("alerts"))]);
  }
  function handle(text) {
    const done = st.mode === "customer" ? customerTurn(text) : staffTurn(text);
    if (done) return;
    if (st.ai) askAI(text); else fallback(text);
  }

  // ------------------------------------------------------------ lifecycle
  function mount({ mode, user }) {
    st.mode = mode; st.user = user; st.msgs = []; st.turns = []; st.acts = {}; st.open = false; st.busy = false;
    if (mode === "customer") {
      const lang = user.lang || "en";
      const A = cApi();
      st.msgs.push({ from: "bot", html: tr(lang, "hi", { name: ", " + esc(user.name.split(" ")[0]) }), chips: A.SVCS.slice(0, 4).map((s) => chip(s[lang] || s.en, () => customerTurn(s.en))) });
    } else {
      st.msgs.push({ from: "bot", html: `Hello ${esc(user.name)}. Ask me about ${esc(D.meta.day_labels[D.meta.plan_days[0]])}: why it's busy, where queues will build, what to do, or a what-if.`,
        chips: [chip("Why is tomorrow busy?", () => staffTurn("why busy")), chip("Show alerts", () => staffTurn("alerts")), chip("What should I do?", () => staffTurn("recommend"))] });
    }
    render();
    try {
      if (window.claude && typeof window.claude.use === "function") window.claude.use("sample").then((s) => { if (s && st.mode) { st.ai = s; render(); } }).catch(() => {});
    } catch (e) { /* no viewer runtime */ }
  }
  function unmount() { st.mode = null; st.open = false; if (st.ctl) try { st.ctl.abort(); } catch (e) { /* ignore */ } render(); }
  function open() { st.open = true; render(); focusIn(); }
  function refresh() { render(); }
  return { mount, unmount, open, refresh };
})();

</script>

  const fmt = Charts.fmt;

  // ------------------------------------------------------------ demo store (this browser only)

  const DEMO_CUSTOMERS = {
    "9000000001": { name: "Meena Rao", mobile: "9000000001", branch: "B01", lang: "kn", age: "60-79", digital: false, help: false, demo: true },
    "9000000002": { name: "Arjun Kumar", mobile: "9000000002", branch: "B02", lang: "en", age: "18-59", digital: true, help: false, demo: true },
  };
  const DEMO_STAFF = {
    DB10001: { name: "Suresh H", empId: "DB10001", branch: "B01", role: "manager", demo: true },
    DB10002: { name: "Priya S", empId: "DB10002", branch: "B01", role: "counter", staffId: "JAY04", demo: true },
    DB10003: { name: "Regional Office", empId: "DB10003", branch: "B01", role: "regional", demo: true },

  const DEMO_PASSWORD = "demo1234";
  const customerBy = (m) => Store.data.customers[m] || DEMO_CUSTOMERS[m];

  async function hashPw(salt, pw) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + "|" + pw));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch (e) {
      let h = 0; for (const c of salt + "|" + pw) h = (h * 31 + c.charCodeAt(0)) | 0; return "h" + h;
    }
  }
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }
  window.UI = { toast, esc, BR };

  // ------------------------------------------------------------ router
  const app = () => document.getElementById("app");
  function go(h) { if (location.hash === "#" + h) route(); else location.hash = "#" + h; }
  function route() {
    const h = (location.hash || "#home").slice(1) || "home";
    const sess = Store.data.session;
    if (window.StaffApp) StaffApp.unmount();
    if (window.CustomerApp) CustomerApp.unmount();
    if (window.Chat) Chat.unmount();
